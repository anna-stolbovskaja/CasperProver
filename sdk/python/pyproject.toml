[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casperprover-sdk"
version = "0.1.0"
description = "CasperProver Python SDK + cp CLI — submit and verify agent proofs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CasperProver", email = "hello@casperprover.xyz" },
]
keywords = ["casper", "casperprover", "zk", "proof", "agent", "hackathon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
cprover = "casperprover_sdk.cli:main"
casperprover = "casperprover_sdk.cli:main"

[project.urls]
Homepage = "https://casperprover.xyz"
Source = "https://github.com/anna-stolbovskaja/CasperProver"

[tool.setuptools.packages.find]
where = ["."]
include = ["casperprover_sdk*"]
