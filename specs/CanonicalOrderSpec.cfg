\* TLC configuration for the canonical-hash sort-invariance spec.
\* Small finite model — 4 candidate keys, sequences of length <= 3.
\* At |Keys|=4, MaxItems=3, TLC exhaustively enumerates every
\* distinct-key input sequence of length 0..3 (1 + 4 + 12 + 24 = 41
\* input shapes), then checks all four sort-invariance invariants at
\* every reachable state.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Keys     = {1, 2, 3, 4}
    MaxItems = 3

INVARIANTS
    TypeOK
    SortIsIdempotent
    SortPreservesMultiset
    SortDependsOnlyOnSet
    SortIsMonotone
    SafetyInvariant
