\* TLC configuration for the economic-slashing spec.
\* Small finite model — 2 agents, 2 callers, 2 proof ids, small deposit
\* range, tight event budget. Kept intentionally lean because the state
\* space explodes with 6 asynchronous action families; the exhaustive
\* checks are representative because the SLASH_BPS = 2000 arithmetic
\* gets exercised across stake_before \in {1..8}.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Agents     = {a1, a2}
    Callers    = {c1, c2}
    ProofIds   = {p1, p2}
    NONE       = NONE
    MaxEvents  = 5
    MaxDeposit = 4

INVARIANTS
    TypeOK
    StakesNonNegative
    TotalRecordedMatchesSum
    TotalRecordedLeqBalance
    SlashedProofOncePerId
    SlashRequiresRevoked
    SlashRequiresAgentMatch
    SlashBoundedByStake
    SlashIsExactlyTwentyPercent
    SlashAmountPositive
    UnstakeBoundedByStake
    SafetyInvariant
