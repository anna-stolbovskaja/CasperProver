[package]
name = "governance"
version = "0.1.0"
edition = "2024"

[dependencies]
casper-contract = "5.1"
casper-types = "7.0"

[features]

[[bin]]
name = "governance"
path = "src/main.rs"
bench = false
doctest = false
test = false

# [profile.*] is only honored at the workspace root (see contracts/Cargo.toml)
# -- a per-member copy here is silently ignored by Cargo and was removed.
#
# This file used to end with an empty `[workspace]` table, presumably
# copy-pasted from a standalone-crate template. That marks this directory as
# its OWN workspace root, which conflicts with `governance` also being listed
# as a member of the parent `contracts/Cargo.toml` workspace -- Cargo refused
# to build anything under contracts/ at all ("multiple workspace roots found
# in the same workspace: contracts/governance and contracts"), breaking the
# build-contracts CI job for every contract, not just governance. Removed.
