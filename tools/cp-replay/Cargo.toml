[package]
name = "cp-replay"
version = "0.1.0"
edition = "2021"
description = "Deterministic replay harness for CasperProver ml-attest-v0 attestations."
license = "Apache-2.0"
repository = "https://github.com/anna-stolbovskaja/CasperProver"

# NOT part of the contracts/ workspace on purpose: contracts/ targets
# wasm32-unknown-unknown under nightly-2025-01-01 for Casper testnet
# compatibility. This crate is a host-side CLI aimed at auditors on
# stable Rust — mixing the two targets in one workspace would force
# every contracts/ member to compile against std, breaking WASM builds.

[[bin]]
name = "cp-replay"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
