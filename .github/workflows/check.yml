name: check
on: [push, pull_request]
jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: cd engine && go test -race -v ./...

  go-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: cd engine && go vet ./...

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: engine

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: cd sdk && go build ./...
      - run: cd sdk && go vet ./...
      - run: cd sdk && go test -race -v ./...

  sdk-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: sdk

  build-contracts:
    # Builds all 8 contract crates, including the three currently
    # undeployed ones (proof-of-inference, model-registry,
    # proof-aggregation). Enforced by CP_FINAL_TASKS_V2 Gate 1.3.
    #
    # Toolchain: pinned to nightly-2025-01-01, the version Viktor
    # empirically verified against Casper testnet 2.0. Newer nightlies
    # (2025-02-01, 2025-03-01) build fine locally but the produced WASM
    # is rejected on-chain with 'Bulk memory operations are not
    # supported'. See docs/DEPLOYMENT_LESSONS.md (added in
    # chore/deploy-lessons-and-hash-sweep) and contracts/rust-toolchain.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-01-01
          targets: wasm32-unknown-unknown
      # Already-deployed contracts.
      - name: build proof-registry
        run: cd contracts/proof-registry && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: build verifier-gate
        run: cd contracts/verifier-gate && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: build defi-mock
        run: cd contracts/defi-mock && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: build stake-slashing
        run: cd contracts/stake-slashing && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: build stake-slashing-session
        run: cd contracts/stake-slashing-session && cargo build --release --target wasm32-unknown-unknown --no-default-features
      # Written but not-yet-deployed contracts. Building them in CI
      # keeps the code from bit-rotting until a safe deploy path opens.
      - name: build proof-of-inference (undeployed)
        run: cd contracts/proof-of-inference && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: build model-registry (undeployed)
        run: cd contracts/model-registry && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: build proof-aggregation (undeployed)
        run: cd contracts/proof-aggregation && cargo build --release --target wasm32-unknown-unknown --no-default-features
      - name: report wasm sizes
        # Human-readable size report for every produced artefact. If
        # anything crosses ~64KB, the SDK's installOrUpgrade() JS path
        # will refuse it -- deploy via CLI/RPC instead (documented in
        # DEPLOYMENT_LESSONS).
        run: |
          echo "### Contract WASM sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          for w in contracts/target/wasm32-unknown-unknown/release/*.wasm; do
            sz=$(stat -c%s "$w")
            name=$(basename "$w")
            printf '| %s | %s bytes (%.1fK) |\n' "$name" "$sz" "$(echo "scale=1; $sz/1024" | bc)" >> $GITHUB_STEP_SUMMARY
          done
          cat $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasms
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  test-contracts:
    runs-on: ubuntu-latest
    needs: build-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-01-01
      - run: cd contracts/tests && cargo test --release
